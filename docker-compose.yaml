services:
  saj2mqtt:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/home/node/saj2mqtt/src
    container_name: saj2mqtt
    expose:
      - "5000"
      - "502"
    ports:
      - "5000:5000"
      # Modbus TCP, polled by the E-MVP edge server.
      - "502:502"
    command: npm run start
